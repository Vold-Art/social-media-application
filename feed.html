<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Feed | Social App</title>
		<link rel="icon" href="./favicon.ico" />
		<link rel="stylesheet" href="./src/css/style.css" />
	</head>

	<body
		class="font-roboto bg-gray-100 min-h-screen flex flex-col text-gray-900"
	>
		<header class="bg-charcoal text-white shadow-md">
			<nav
				class="container mx-auto flex flex-wrap items-center justify-between px-4 py-3"
			>
				<h1 class="font-semibold text-lg tracking-wide">Social App</h1>
				<div class="flex gap-4 text-sm sm:text-base">
					<a href="./feed.html" class="hover:text-gray-300 font-semibold"
						>Feed</a
					>
					<a href="./register.html" class="hover:text-gray-300">Register</a>
					<a href="./logout.html" class="hover:text-gray-300">Logout</a>
					<a href="./profile.html" class="hover:text-gray-300">Profile</a>
				</div>
			</nav>
		</header>

		<main class="container mx-auto flex-1 px-4 py-8 max-w-4xl">
			<section class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center">
				<h2 class="text-2xl font-bold text-gray-800">Feed</h2>
				<div class="sm:ml-auto w-full sm:w-64">
					<input
						type="search"
						id="post-search"
						placeholder="Search posts..."
						aria-label="Search posts"
						class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
					/>
				</div>
			</section>

			<section class="bg-white rounded-lg shadow-md p-6 mb-8">
				<h3 class="text-lg font-semibold text-gray-800 mb-4">
					Create a new post
				</h3>

				<form
					id="new-post-form"
					class="space-y-4"
					aria-describedby="feed-error"
				>
					<div>
						<label
							for="post-title"
							class="block text-sm font-medium text-gray-700 mb-1"
							>Title</label
						>
						<input
							type="text"
							id="post-title"
							required
							class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
						/>
					</div>

					<div>
						<label
							for="post-body"
							class="block text-sm font-medium text-gray-700 mb-1"
							>Body</label
						>
						<textarea
							id="post-body"
							rows="3"
							class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm resize-y focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
						></textarea>
					</div>

					<div>
						<label
							for="post-media-url"
							class="block text-sm font-medium text-gray-700 mb-1"
							>Image URL (optional)</label
						>
						<input
							id="post-media-url"
							type="url"
							placeholder="https://…"
							class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
						/>
					</div>

					<div>
						<label
							for="post-media-alt"
							class="block text-sm font-medium text-gray-700 mb-1"
							>Image alt text (optional)</label
						>
						<input
							id="post-media-alt"
							type="text"
							placeholder="Describe the image"
							class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
						/>
					</div>

					<button
						type="submit"
						class="inline-flex items-center justify-center bg-gray-500 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-charcoal focus:outline-none focus:ring-2 focus:ring-charcoal focus:ring-offset-2"
					>
						Publish
					</button>

					<p
						id="feed-error"
						role="alert"
						aria-live="assertive"
						class="text-red-500 text-sm mt-2 min-h-[1.25rem]"
					></p>
				</form>
			</section>

			<section
				id="post-list"
				aria-live="polite"
				class="space-y-4 max-w-4xl mx-auto"
			></section>

			<nav
				id="pagination"
				class="mt-8 flex items-center justify-center gap-4"
				aria-label="Post pagination"
			></nav>
		</main>

		<script type="module" src="./src/pages/feed.js"></script>
		<script type="module" src="./src/components/header.js"></script>
	</body>
</html>
