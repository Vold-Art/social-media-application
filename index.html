<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Login | Social App</title>
		<link rel="icon" href="./favicon.ico" />
		<link rel="stylesheet" href="./src/css/style.css" />
	</head>

	<body
		class="font-roboto bg-gray-100 min-h-screen flex flex-col text-gray-900"
	>
		<header class="bg-charcoal text-white shadow-md">
			<nav
				class="container mx-auto flex flex-wrap items-center justify-between px-4 py-3"
			>
				<h1 class="font-semibold text-lg tracking-wide">Social App</h1>
				<div class="flex gap-4 text-sm sm:text-base">
					<a href="./feed.html" class="hover:text-gray-300 font-semibold"
						>Feed</a
					>
					<a href="./register.html" class="hover:text-gray-300">Register</a>
					<a href="./logout.html" class="hover:text-gray-300">Logout</a>
					<a href="./profile.html" class="hover:text-gray-300">Profile</a>
				</div>
			</nav>
		</header>

		<main class="flex-1 flex items-center justify-center px-4 py-8">
			<section class="w-full max-w-md bg-white rounded-lg shadow-md p-6">
				<h2 class="text-2xl font-bold text-gray-800 mb-4">Login</h2>

				<form id="login-form" class="space-y-4" novalidate>
					<div>
						<label
							for="login-email"
							class="block text-sm font-medium text-gray-700 mb-1"
							>Email</label
						>
						<input
							id="login-email"
							type="email"
							required
							class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
						/>
					</div>

					<div>
						<label
							for="login-password"
							class="block text-sm font-medium text-gray-700 mb-1"
							>Password</label
						>
						<input
							id="login-password"
							type="password"
							required
							minlength="8"
							class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
						/>
						<p class="text-xs text-gray-500 mt-1">
							Password must be at least 8 characters.
						</p>
					</div>

					<button
						type="submit"
						class="w-full inline-flex items-center justify-center bg-gray-500 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-charcoal focus:outline-none focus:ring-2 focus:ring-charcoal focus:ring-offset-2"
					>
						Log in
					</button>

					<p
						id="login-error"
						class="text-red-500 text-sm min-h-[1.25rem] mt-2"
					></p>
				</form>

				<p class="mt-4 text-sm text-gray-700">
					Not a user?
					<a href="./register.html" class="text-blue-600 hover:underline"
						>Register here</a
					>
				</p>
			</section>
		</main>

		<script type="module" src="./src/pages/login.js"></script>
	</body>
</html>
